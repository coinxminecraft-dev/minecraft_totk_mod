name: Build jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip FusionTotK_Fabric_26_2_source_fixed.zip
      - run: sed -i 's/^loom_version=.*/loom_version=1.17-SNAPSHOT/' FusionTotK/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build
        working-directory: FusionTotK
      - uses: actions/upload-artifact@v4
        with:
          name: fusiontotk-jar
          path: FusionTotK/build/libs/*.jar
